name: CPU
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'setuptools>=69' wheel 'torch>=2.8' numpy pytest
      - run: python -m pip install --no-build-isolation -e .
      - run: python -m pytest -m 'not cuda and not large'
